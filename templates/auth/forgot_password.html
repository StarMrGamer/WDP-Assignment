{% extends "base.html" %}

{% block title %}Forgot Password - GenCon SG{% endblock %}

{% block extra_css %}
<style>
    body {
        background: linear-gradient(135deg, #E25838 0%, #E25838 40%, #7A164B 70%, #4f084c 100%);
        background-attachment: fixed;
    }

    .main-content {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4rem 1rem;
        min-height: calc(100vh - 80px);
    }

    .reset-container {
        max-width: 420px;
        width: 100%;
        margin: auto;
    }

    .reset-card {
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(20px) saturate(160%);
        -webkit-backdrop-filter: blur(20px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 1.5rem;
        padding: 2rem;
        color: white;
        animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .reset-card h2 {
        font-size: 1.75rem;
        font-weight: 800;
        margin-bottom: 0.25rem;
    }

    .reset-card .subtitle {
        font-size: 0.9rem;
        opacity: 0.75;
        margin-bottom: 1.5rem;
    }

    .reset-card .form-label {
        color: rgba(255,255,255,0.85);
        font-weight: 600;
        font-size: 0.875rem;
        margin-bottom: 0.3rem;
    }

    .reset-card .form-control {
        background: rgba(255,255,255,0.15);
        border: 1.5px solid rgba(255,255,255,0.3);
        border-radius: 0.75rem;
        color: white;
        padding: 0.7rem 1rem;
        font-size: 0.95rem;
    }

    .reset-card .form-control::placeholder {
        color: rgba(255,255,255,0.45);
    }

    .reset-card .form-control:focus {
        background: rgba(255,255,255,0.22);
        border-color: rgba(255,255,255,0.7);
        box-shadow: 0 0 0 3px rgba(255,255,255,0.15);
        outline: none;
        color: white;
    }

    .btn-reset {
        width: 100%;
        padding: 0.8rem;
        font-size: 1rem;
        font-weight: 700;
        border-radius: 2rem;
        border: none;
        background: white;
        color: #7A164B;
        transition: all 0.25s ease;
        margin-top: 0.5rem;
        cursor: pointer;
    }

    .btn-reset:hover {
        background: #f1fab7;
        color: #4f084c;
        transform: translateY(-2px);
    }

    .back-link {
        text-align: center;
        margin-top: 1rem;
        font-size: 0.875rem;
    }

    .back-link a {
        color: rgba(255,255,255,0.7);
        text-decoration: none;
        font-weight: 600;
    }

    .back-link a:hover { color: white; }
</style>
{% endblock %}

{% block content %}
<div class="reset-container">
    <div class="reset-card">
        <h2><i class="fas fa-key me-2"></i>Forgot Password</h2>
        <p class="subtitle">Enter your email and we'll send you a reset link</p>

        <form method="POST" action="{{ url_for('auth.forgot_password') }}">
            {{ form.hidden_tag() }}

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" name="email"
                       placeholder="you@example.com" required autofocus>
            </div>

            <button type="submit" class="btn-reset">
                <i class="fas fa-paper-plane me-2"></i>Send Reset Link
            </button>
        </form>

        <div class="back-link">
            <a href="{{ url_for('main.index') }}"><i class="fas fa-arrow-left me-1"></i>Back to Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
